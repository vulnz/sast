# Build the `sast` launcher wheel + sdist and publish to PyPI.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token/secret needed.
# It is configured under the project's "Publishing" settings on PyPI with:
#     Owner:        vulnz
#     Repository:   sast
#     Workflow:     publish.yml                 (this file)
#     Environment:  pypi
#
# A push of a version tag (v0.1.0, v1.2.3, ...) triggers a release. You can
# also trigger it manually from the Actions tab.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment name MUST match what you entered in PyPI's trusted-
    # publisher form (here: "pypi").
    environment:
      name: pypi
      url: https://pypi.org/p/sast
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
