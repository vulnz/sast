# sast — pip launcher for the Insomnia SAST engine.
#
# This package contains ONLY a tiny pure-Python launcher (one dep: certifi).
# `pip install sast` does not download the engine; the self-contained SAST
# binary is fetched on first run from insom.ai, matched to the host OS,
# checksum-verified and cached. This keeps the wheel a few KB and lets new
# engine builds ship without republishing to PyPI.
#
# Build a wheel:   python -m build
# Install local:   pip install -e .

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sast"
version = "1.6.6"
description = "sast — free, fast static application security testing for CI/CD. Installs a self-contained SAST engine on first run: native AST + cross-file taint across 16 languages (no external tools), secrets with live key validation, SCA, vulnerable JS libraries, CMS plugin/theme/core CVEs (WordPress/Joomla/Drupal/Magento), web-shell & malware detection, IaC; HTML/JSON/SARIF."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "CQR Cybersecurity LLC" }]
keywords = [
    "sast", "static-analysis", "static-application-security-testing",
    "security", "security-scanner", "vulnerability-scanner", "vulnerability",
    "sca", "software-composition-analysis", "dependency-scanner", "cve",
    "secret-scanning", "secret-detection", "secrets", "taint-analysis",
    "sarif", "code-scanning", "appsec", "devsecops", "cicd", "ci", "owasp",
    "semgrep-alternative", "snyk-alternative", "bandit-alternative",
    "iac-scanning", "malware-detection", "web-shell", "insomnia", "insom",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
# certifi only: gives us a real CA bundle so the first-run HTTPS fetch works on
# macOS python.org / pyenv builds that ship without a usable system CA store.
dependencies = ["certifi>=2023.7.22"]

[project.urls]
Homepage = "https://insom.ai"

[project.scripts]
sast = "sast.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
